name: Gerar APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # v3 tentava instalar o pacote Android SDK "tools", removido pelo Google.
      # v4 usa apenas "platform-tools" e as command-line tools atuais.
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Instalar plataforma Android 35 e Build Tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Testar cálculo SQL financeiro (Python/SQLite)
        run: python3 tools/verify_refactor.py
      - name: Testar paginação e restauração (Python/SQLite)
        run: python3 tools/verify_alpha11.py
      - name: Testes e APK Debug
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Financas-da-Viagem-v0.1.0-alpha.11-APK-e-relatorios
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn
